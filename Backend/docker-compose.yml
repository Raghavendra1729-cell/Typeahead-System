version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: typeahead
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d typeahead"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-node-1:
    image: redis:7
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes

  redis-node-2:
    image: redis:7
    ports:
      - "6380:6379"
    command: redis-server --appendonly yes

  redis-node-3:
    image: redis:7
    ports:
      - "6381:6379"
    command: redis-server --appendonly yes

volumes:
  postgres_data:
